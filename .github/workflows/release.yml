name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Tag must match package version
        run: |
          node -e "const p=require('./package.json'); const t=process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (p.version !== t) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json ' + p.version); process.exit(1) }"

      - name: Tests
        run: node --test --test-concurrency=1 --experimental-test-coverage --test-coverage-lines=85 --test-coverage-branches=72 --test-coverage-functions=82 "test/*.test.js"

      - name: Rule catalog audit
        run: node scripts/rule-audit.mjs --strict

      - name: Pack
        run: npm pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes --title "$GITHUB_REF_NAME"

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    # Must match the npm trusted publisher's environment name (and release.yml).
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Authenticates through the GitHub OIDC token; no npm secret is stored.
      # Provenance is attached automatically for a trusted publisher.
      - name: Publish
        run: npm publish --access public
